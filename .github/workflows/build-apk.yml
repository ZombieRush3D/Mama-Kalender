name: Mama-Kalender APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Kalender für Android vorbereiten
        run: |
          test -f index.html || (echo "index.html fehlt im Hauptordner." && exit 1)
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init "Mama-Kalender" "de.zombierush3d.mamakalender" --web-dir=www

      - name: Android-Projekt erstellen
        run: |
          npx cap add android
          npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Mama-Kalender-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
