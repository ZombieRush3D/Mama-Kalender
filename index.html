<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mamas Kalender</title>
<style>
:root{--bg:#f3f0f7;--card:#fff;--ink:#2f2340;--soft:#6f6380;--line:#e1dbea;--acc:#5b3f7a;--today:#e3a73b;--dot:#4f8a6b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1526;--card:#281f36;--ink:#f1ecf7;--soft:#a99dbb;--line:#3b3050;--acc:#b794dc;--today:#e3a73b;--dot:#7fc29c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:.2px}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer}
button:focus-visible,.day:focus-visible,input:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.prim{background:var(--acc);border-color:var(--acc);color:#fff}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:.8rem;color:var(--soft);padding:6px 0}
.day{aspect-ratio:1/1.05;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;font-size:1rem;cursor:pointer;position:relative}
.day.out{opacity:.35}
.day.we{color:var(--acc)}
.day.today{background:var(--today);border-color:var(--today);color:#2f2340;font-weight:700}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--dot);position:absolute;bottom:7px}
h2{font-size:1.1rem;margin:22px 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.list small{color:var(--soft);display:block}
.empty{color:var(--soft)}
dialog{border:none;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,10,30,.55)}
input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--soft)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.x{padding:4px 9px}
.banner{background:var(--acc);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.notif{width:100%;margin-bottom:10px}
input[type=time]{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="nav">
    <button id="prev" aria-label="Voriger Monat">‹</button>
    <button id="now">Heute</button>
    <button id="next" aria-label="Nächster Monat">›</button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<button class="notif" id="notif">Benachrichtigungen einschalten</button>
<div class="dow" id="dow"></div>
<div class="grid" id="grid"></div>
<h2>Anstehend in diesem Monat</h2>
<ul class="list" id="month"></ul>

<dialog id="dlg">
  <h3 id="dlgTitle" style="margin:0 0 10px"></h3>
  <ul class="list" id="dayList"></ul>
  <input type="text" id="txt" placeholder="Neuer Eintrag, z. B. Arzttermin 10 Uhr" maxlength="80">
  <label class="chk">Uhrzeit (optional) <input type="time" id="time" style="margin:0"></label>
  <label class="chk"><input type="checkbox" id="yearly"> Jedes Jahr wiederholen (Geburtstag)</label>
  <div class="row">
    <button id="close">Schließen</button>
    <button class="prim" id="add">Eintrag speichern</button>
  </div>
</dialog>

<script>
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DOW=["Mo","Di","Mi","Do","Fr","Sa","So"];
let store=[];
try{store=JSON.parse(localStorage.getItem("mamas-kalender")||"[]")}catch(e){store=[]}
function save(){try{localStorage.setItem("mamas-kalender",JSON.stringify(store))}catch(e){}}
const $=id=>document.getElementById(id);
let view=new Date();view.setDate(1);
let sel=null;
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function entriesFor(d){
  const k=key(d),md=k.slice(5);
  return store.filter(e=>e.date===k||(e.yearly&&e.date.slice(5)===md));
}
$("dow").innerHTML=DOW.map(d=>"<div>"+d+"</div>").join("");
function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $("title").textContent=MONTHS[m]+" "+y;
  const first=new Date(y,m,1),offset=(first.getDay()+6)%7;
  const start=new Date(y,m,1-offset);
  const todayK=key(new Date());
  let html="";
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    if(i>=35&&d.getMonth()!==m)break;
    const cls=["day"];
    if(d.getMonth()!==m)cls.push("out");
    if(d.getDay()===0||d.getDay()===6)cls.push("we");
    if(key(d)===todayK)cls.push("today");
    html+='<button class="'+cls.join(" ")+'" data-d="'+key(d)+'">'+d.getDate()+(entriesFor(d).length?'<span class="dot"></span>':"")+"</button>";
  }
  $("grid").innerHTML=html;
  const items=[];
  const days=new Date(y,m+1,0).getDate();
  for(let i=1;i<=days;i++){const d=new Date(y,m,i);entriesFor(d).forEach(e=>items.push({d,e}))}
  $("month").innerHTML=items.length?items.map(x=>"<li><span>"+(x.e.time?x.e.time+" · ":"")+esc(x.e.text)+"<small>"+x.d.getDate()+". "+MONTHS[m]+(x.e.yearly?" · jährlich":"")+"</small></span></li>").join(""):'<li class="empty">Noch keine Einträge.</li>';
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openDay(k){
  sel=k;const [y,m,d]=k.split("-").map(Number);
  $("dlgTitle").textContent=d+". "+MONTHS[m-1]+" "+y;
  renderDay();$("txt").value="";$("yearly").checked=false;
  $("dlg").showModal();
}
function renderDay(){
  const [y,m,d]=sel.split("-").map(Number);
  const list=entriesFor(new Date(y,m-1,d));
  $("dayList").innerHTML=list.length?list.map(e=>'<li><span>'+(e.time?e.time+' · ':'')+esc(e.text)+(e.yearly?"<small>jährlich</small>":"")+'</span><button class="x" data-id="'+e.id+'" aria-label="Eintrag löschen">✕</button></li>').join(""):'<li class="empty">Keine Einträge an diesem Tag.</li>';
}
$("grid").addEventListener("click",e=>{const b=e.target.closest(".day");if(b)openDay(b.dataset.d)});
$("add").onclick=()=>{
  const t=$("txt").value.trim();if(!t)return;
  store.push({id:Date.now()+"",date:sel,text:t,yearly:$("yearly").checked,time:$("time").value});$("time").value="";
  save();$("txt").value="";$("yearly").checked=false;renderDay();render();
};
$("dayList").addEventListener("click",e=>{
  const b=e.target.closest("[data-id]");if(!b)return;
  store=store.filter(x=>x.id!==b.dataset.id);save();renderDay();render();
});
$("close").onclick=()=>$("dlg").close();
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("now").onclick=()=>{view=new Date();view.setDate(1);render()};
const baseRender=render;
render=function(){baseRender();banner()};
function banner(){const t=entriesFor(new Date()),el=$("banner");if(!t.length){el.hidden=true;return}el.hidden=false;el.textContent="Heute: "+t.map(e=>(e.time?e.time+" ":"")+e.text).join(", ")}
function updNotif(){const b=$("notif");if(!("Notification" in window)){b.hidden=true;return}const g=Notification.permission==="granted";b.textContent=g?"Benachrichtigungen sind an":"Benachrichtigungen einschalten";b.disabled=g}
$("notif").onclick=async()=>{try{await Notification.requestPermission()}catch(e){}updNotif();check()};
let done={};try{done=JSON.parse(localStorage.getItem("mk-done")||"{}")}catch(e){}
function check(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),k=key(n);
  entriesFor(n).forEach(e=>{
    const id=e.id+k;
    if(done[id]||(e.time&&hm<e.time))return;
    try{new Notification("Mamas Kalender",{body:(e.time?e.time+" · ":"")+e.text})}catch(err){}
    done[id]=1;
  });
  try{const keep={};Object.keys(done).forEach(i=>{if(i.endsWith(k))keep[i]=1});done=keep;localStorage.setItem("mk-done",JSON.stringify(done))}catch(err){}
}
setInterval(check,20000);
document.addEventListener("visibilitychange",check);
render();updNotif();check();
</script>
</body>
</html>
